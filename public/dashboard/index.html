<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Context — Dashboard</title>
  <link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body>
  <aside class="sidebar">
    <a class="logo" href="/"><span>V</span>Visual Context</a>
    <div class="workspace-label">Workspace</div>
    <button class="project active"><span class="project-mark">F</span><span><strong>Field Notes</strong><small>demo-site</small></span><b id="project-count">0</b></button>
    <div class="sidebar-note"><span>●</span><p><strong>Collector is active</strong>Open the sample site to send another capture.</p></div>
    <a class="sample-link" href="/demo">Open sample site ↗</a>
  </aside>

  <main>
    <header class="topbar">
      <div><p class="breadcrumb">Projects / Field Notes</p><h1>Rendered text</h1></div>
      <div class="header-actions">
        <span id="last-updated">Waiting for data</span>
        <button id="refresh" type="button">↻ Refresh</button>
        <button id="clear-captures" class="danger-button" type="button">Clear captures</button>
      </div>
    </header>

    <section class="controls" aria-label="Capture filters">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search captured text…"></label>
      <select id="capture-filter" aria-label="Capture run"><option value="">All capture runs</option></select>
      <div class="view-toggle" aria-label="View type"><button class="active" type="button">Context</button><button type="button" disabled>Table</button></div>
    </section>

    <section class="summary" aria-live="polite">
      <p><strong id="fragment-count">0</strong> text fragments</p>
      <p><strong id="capture-count">0</strong> <span id="capture-run-label">capture runs</span></p>
      <p id="page-summary">No pages captured yet</p>
    </section>

    <section id="results" class="results"></section>
  </main>

  <template id="empty-template">
    <div class="empty-state"><span>Ab</span><h2>No rendered text yet</h2><p>Visit the sample site to create your first visual-context capture.</p><a href="/demo">Open sample site</a></div>
  </template>
  <script src="/dashboard/app.js"></script>
</body>
</html>
